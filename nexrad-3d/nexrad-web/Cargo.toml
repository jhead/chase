[package]
name = "nexrad-web"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
nexrad-render = { path = "../nexrad-render" }
nexrad-core = { path = "../nexrad-core" }
layer-basemap = { path = "../../plugins/layer-basemap/crate" }
layer-radar-l2 = { path = "../../plugins/layer-radar-l2/crate" }
layer-noaa-alerts = { path = "../../plugins/layer-noaa-alerts/crate" }
layer-radar-sites = { path = "../../plugins/layer-radar-sites/crate" }
async-channel = "2.5.0"
bevy = "0.18.1"
log = "0.4"
serde_json = "1"
wasm-bindgen = "0.2"
js-sys = "0.3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
wasm-bindgen-futures = "0.4"
