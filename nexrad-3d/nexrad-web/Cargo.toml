[package]
name = "nexrad-web"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
nexrad-render = { path = "../nexrad-render" }
nexrad-core = { path = "../nexrad-core" }
async-channel = "2.5.0"
bevy = "0.18.1"
log = "0.4"
wasm-bindgen = "0.2"
js-sys = "0.3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
