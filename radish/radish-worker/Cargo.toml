[package]
name = "radish-worker"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
radish-core = { path = "../radish-core", features = ["parse"] }
radish-fetch = { path = "../radish-fetch" }
nexrad-data = { version = "1.0.0-rc.6", default-features = false, features = ["nexrad-model", "aws"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console"] }
postcard = { version = "1", features = ["alloc"] }
log = "0.4"
console_error_panic_hook = "0.1"
