[package]
name = "nexrad-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "nexrad-3d"
path = "src/main.rs"

[dependencies]
nexrad-core = { path = "../nexrad-core" }
nexrad-render = { path = "../nexrad-render" }
nexrad-fetch = { path = "../nexrad-fetch" }
# dynamic_linking speeds up dev builds; features are additive so nexrad-render
# also benefits when compiled as part of this crate.
bevy = { version = "0.18.1", features = ["dynamic_linking"] }
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.50.0", features = ["rt-multi-thread"] }
