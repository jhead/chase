[package]
name = "radish-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "radish"
path = "src/main.rs"

[dependencies]
radish-core = { path = "../radish-core" }
radish-render = { path = "../radish-render" }
radish-fetch = { path = "../radish-fetch" }
layer-basemap = { path = "../../plugins/layer-basemap/crate" }
layer-radar-l2 = { path = "../../plugins/layer-radar-l2/crate" }
# dynamic_linking speeds up dev builds; features are additive so radish-render
# also benefits when compiled as part of this crate.
bevy = { version = "0.18.1", features = ["dynamic_linking"] }
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.50.0", features = ["rt-multi-thread"] }
