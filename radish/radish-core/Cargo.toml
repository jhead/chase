[package]
name = "radish-core"
version = "0.1.0"
edition = "2024"

[features]
# Enable NEXRAD Level‑II parsing (pulls in nexrad-data, bzip2). Off for WASM.
parse = ["nexrad-data", "nexrad-model"]

[dependencies]
lin_alg = "1.4.1"
log = "0.4"
nexrad-data = { version = "1.0.0-rc.6", default-features = false, features = ["nexrad-model"], optional = true }
nexrad-model = { version = "1.0.0-rc.2", optional = true }
bzip2 = "0.6.1"
once_cell = "1.19"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
postcard = { version = "1", features = ["alloc"] }
